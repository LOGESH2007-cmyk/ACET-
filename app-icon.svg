<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="40%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#6366F1" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Rounded App Icon Background -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="6" filter="url(#cardGlow)" />

  <!-- Subtle Circuit Grid Accents -->
  <path d="M 64 160 H 140 L 170 190 H 220" stroke="rgba(6, 182, 212, 0.25)" stroke-width="3" fill="none" stroke-linecap="round" />
  <circle cx="220" cy="190" r="4" fill="#06B6D4" />
  
  <path d="M 448 352 H 372 L 342 322 H 292" stroke="rgba(168, 85, 247, 0.25)" stroke-width="3" fill="none" stroke-linecap="round" />
  <circle cx="292" cy="322" r="4" fill="#A855F7" />

  <!-- Electric Lightning Bolt (Icon Centerpiece) -->
  <path d="M 284 64 L 148 272 H 260 L 228 448 L 364 240 H 252 Z" 
        fill="url(#boltGrad)" 
        filter="url(#glow)" />

  <!-- Mini ACET Brand Ribbon -->
  <rect x="156" y="400" width="200" height="38" rx="19" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(99, 102, 241, 0.5)" stroke-width="2" />
  <text x="256" y="425" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="800" fill="#E2E8F0" text-anchor="middle" letter-spacing="2">ACET AI</text>
</svg>
